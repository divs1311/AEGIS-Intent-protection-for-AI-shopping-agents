  <link rel="stylesheet" href="css/app.css">

  <header class="topbar">

    <div class="top-right">
      <span id="chainPill" class="pill pill-ok"></span>
      <span class="pill pill-sim" title="No real agent, store, payment or model is connected">Simulated</span>

        <button class="link-btn" data-action="reset">Reset demo</button>
      </div>

    <main id="main" class="main" tabindex="-1"></main>
    <aside id="inspector" class="inspector" aria-label="Engine"></aside>

  <nav class="tabbar" aria-label="Screens">
    <a href="#checkout" data-nav="checkout"><span class="t-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2l2-8H6.3"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><b class="badge" data-badge="checkout" hidden></b></span>Checkout</a>

    <a href="#ledger" data-nav="ledger"><span class="t-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg><b class="badge badge-dot badge-bad" data-badge="ledger" hidden></b></span>Ledger</a>
    <a href="#lab" data-nav="lab"><span class="t-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 001.8 3h10.4a2 2 0 001.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg></span>Lab</a>

  <div id="tourRoot"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <div class="modal-actions"><button class="btn btn-ghost" data-modal="cancel">Cancel</button><button class="btn btn-quiet" data-modal="ok">Allow this order</button></div>
    </div>
  </div>
